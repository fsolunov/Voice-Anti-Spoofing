defaults:
  - model: lcnn
  - writer: wandb
  - metrics: asvspoof
  - datasets: asvspoof_deadline
  - dataloader: asvspoof_deadline
  - transforms: asvspoof
  - _self_

data_root: ${oc.env:ASVSPOOF_ROOT}

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.0

lr_scheduler:
  _target_: src.utils.EpochStepLR
  steps_per_epoch: ${trainer.epoch_len}
  decay_every_epochs: 10
  gamma: 0.5

loss_function:
  _target_: src.loss.CrossEntropyLoss

trainer:
  log_step: 50
  n_epochs: 50
  epoch_len: 396
  device_tensors: ["features", "labels"]
  resume_from: null
  from_pretrained: null
  device: cuda
  override: false
  monitor: "min dev_EER"
  save_period: 5
  early_stop: 12
  save_dir: "saved"
  seed: 1
  skip_oom: false
